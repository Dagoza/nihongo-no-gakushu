<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語マスター Nihongo Master — N5 & N4</title>
  <meta name="description" content="Plataforma interactiva para aprender japonés N5 y N4 a partir de tus materiales de apoyo con historias interactivas, práctica de teclado japonés, partículas y kanji.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper" onclick="window.app.switchTab('curriculum')">
        <div class="brand-logo">日</div>
        <div>
          <div class="brand-title">日本語マスター</div>
          <div class="brand-subtitle">Nihongo Master · N5 & N4</div>
        </div>
      </div>

      <!-- Quick Badges -->
      <div class="header-badges">
        <div class="stat-badge" title="Racha de estudio activa">
          <span class="icon">🔥</span>
          <span id="stat-streak">1d</span>
        </div>

        <div class="stat-badge" title="Nivel y Puntos de Experiencia">
          <span class="icon">⭐</span>
          <span id="stat-xp">Nivel 1 (0 XP)</span>
        </div>

        <div class="stat-badge" title="Partículas dominadas del checklist N5">
          <span class="icon">🎯</span>
          <span id="stat-particles">0/25</span>
        </div>

        <div class="stat-badge" title="Palabras aprendidas">
          <span class="icon">📚</span>
          <span id="stat-words">0 pal.</span>
        </div>

        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar tema día/noche">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs Bar -->
  <nav class="nav-tabs-wrapper">
    <div class="nav-tabs">
      <button class="nav-tab-btn active" data-tab="curriculum" onclick="window.app.switchTab('curriculum')">
        <span>🗺️</span> Ruta Incremental
      </button>
      <button class="nav-tab-btn" data-tab="story" onclick="window.app.switchTab('story')">
        <span>📖</span> Lectura de Historias
      </button>
      <button class="nav-tab-btn" data-tab="particles" onclick="window.app.switchTab('particles')">
        <span>🎯</span> Partículas N5
      </button>
      <button class="nav-tab-btn" data-tab="vocab" onclick="window.app.switchTab('vocab')">
        <span>📚</span> Vocabulario N5/N4
      </button>
      <button class="nav-tab-btn" data-tab="kanji" onclick="window.app.switchTab('kanji')">
        <span>漢</span> Biblioteca Kanji
      </button>
      <button class="nav-tab-btn" data-tab="nhk" onclick="window.app.switchTab('nhk')">
        <span>📻</span> NHK en Español
      </button>
      <button class="nav-tab-btn" data-tab="pdf" onclick="window.app.switchTab('pdf')">
        <span>📑</span> Visor de PDFs
      </button>
      <button class="nav-tab-btn" data-tab="progress" onclick="window.app.switchTab('progress')">
        <span>📊</span> Mi Progreso
      </button>
    </div>
  </nav>

  <!-- Main Viewports -->
  <main class="main-container">
    <section id="curriculum-panel" class="section-panel active"></section>
    <section id="story-panel" class="section-panel"></section>
    <section id="particles-panel" class="section-panel"></section>
    <section id="vocab-panel" class="section-panel"></section>
    <section id="kanji-panel" class="section-panel"></section>
    <section id="nhk-panel" class="section-panel"></section>
    <section id="pdf-panel" class="section-panel"></section>
    <section id="progress-panel" class="section-panel"></section>
  </main>

  <!-- Data Sources -->
  <script src="data/particles.js"></script>
  <script src="data/story.js"></script>
  <script src="data/kanji.js"></script>
  <script src="data/vocabulary_n5.js"></script>
  <script src="data/vocabulary_n4.js"></script>
  <script src="data/nhk_lessons.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/pdf_catalog.js"></script>

  <!-- Core Modules -->
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>

  <!-- Feature Components -->
  <script src="js/components/curriculum.js"></script>
  <script src="js/components/story.js"></script>
  <script src="js/components/particles.js"></script>
  <script src="js/components/vocab.js"></script>
  <script src="js/components/kanji.js"></script>
  <script src="js/components/nhk.js"></script>
  <script src="js/components/pdf_hub.js"></script>

  <!-- Application Controller -->
  <script src="js/app.js"></script>
</body>
</html>
